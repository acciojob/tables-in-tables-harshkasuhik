<!DOCTYPE html>
<html>
<head>
    <title>Nested Tables</title>
</head>
<body>

<table border="1" width="800" height="450" cellspacing="0" cellpadding="10">

    <tr>
        <!-- Left Top -->
        <td width="50%" height="50%">

            <table border="1" width="100%" cellspacing="0" cellpadding="5">
                <tr>
                    <th colspan="2">Nested Table 2</th>
                </tr>

                <tr>
                    <th>Column 1</th>
                    <th>Column 2</th>
                </tr>

                <tr>
                    <td align="center">abc</td>
                    <td align="center">def</td>
                </tr>
            </table>

        </td>

        <!-- Right Top -->
        <td width="50%" height="50%">

            <table border="1" width="100%" cellspacing="0" cellpadding="10">

                <tr>
                    <th>Nested Table 1</th>
                </tr>

                <tr>
                    <td>
                        <ul>
                            <li>List item 1</li>
                            <li>List item 2</li>
                            <li>List item 3</li>
                        </ul>
                    </td>
                </tr>

            </table>

        </td>
    </tr>

    <tr>
        <!-- Left Bottom -->
        <td>

            <table border="1" width="100%" cellspacing="0" cellpadding="5">

                <tr>
                    <th colspan="2">Nested Table 3</th>
                </tr>

                <tr>
                    <td align="center">
                        <a href="#">Nested Table</a>
                    </td>

                    <td align="center">
                        Demo Continued
                    </td>
                </tr>

            </table>

        </td>

        <!-- Right Bottom -->
        <td>

            <table border="1" width="100%" cellspacing="0" cellpadding="5">

                <tr>
                    <th>Nested Table 4</th>
                </tr>

                <tr>
                    <td bgcolor="black" align="center">
                        <font color="white">HTML</font>
                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
