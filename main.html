<!DOCTYPE html>
<html>
<head>
    <title>Nested HTML Tables</title>
</head>
<body>

<table border="1" cellpadding="10" cellspacing="0" width="100%">

    <tr>
        <th colspan="2">Nested Tables</th>
    </tr>

    <tr>

        <!-- Nested Table 2 FIRST -->
        <td>

            <table border="1" cellpadding="5" cellspacing="0" width="100%">

                <tr>
                    <th>Nested Table 2</th>
                    <th>Column 1</th>
                    <th>Column 2</th>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

            </table>

        </td>

        <!-- Nested Table 1 -->
        <td>

            <table border="1" cellpadding="5" cellspacing="0" width="100%">

                <tr>
                    <th>Nested Table 1</th>
                </tr>

                <tr>
                    <td>
                        <ul>
                            <li>List item 1</li>
                            <li>List item 2</li>
                            <li>List item 3</li>
                        </ul>
                    </td>
                </tr>

            </table>

        </td>

    </tr>

    <tr>

        <!-- Nested Table 3 -->
        <td>

            <table border="1" cellpadding="5" cellspacing="0" width="100%">

                <tr>
                    <th>Nested Table 3</th>
                </tr>

                <tr>
                    <td style="background-color:black; color:white; text-align:center;">
                        HTML
                    </td>
                </tr>

            </table>

        </td>

        <!-- Nested Table 4 -->
        <td>

            <table border="1" cellpadding="5" cellspacing="0" width="100%">

                <tr>
                    <th>Nested Table 4</th>
                </tr>

                <tr>
                    <td></td>
                </tr>

                <tr>
                    <td></td>
                </tr>

            </table>

        </td>

    </tr>

</table>

</body>
</html>
